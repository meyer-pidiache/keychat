<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KeyChat — Recibir mensajes cifrados">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <title>Recibir Mensajes — KeyChat</title>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Principal">
      <a href="/" class="nav-logo">KeyChat</a>
      <ul class="nav-links">
        <li><a href="/fb/send">Enviar</a></li>
        <li><a href="/fb/receive">Recibir</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <h1>Recibir Mensajes</h1>
    <form method="GET" action="/fb/receive">
      <label for="pubkey">Tu clave pública (64 hex):</label>
      <input type="text" id="pubkey" name="pubkey" pattern="[0-9a-fA-F]{64}" maxlength="64" required placeholder="Tu clave pública">
      <button type="submit" class="btn">Buscar mensajes</button>
    </form>
    <p><a href="/fb/send">Enviar mensaje</a></p>
  </main>
  <footer class="site-footer">
    <p>KeyChat — Proyecto educativo de criptografía asimétrica y mensajería Nostr</p>
    <p><a href="/">Inicio</a> | <a href="/fb/send">Enviar mensaje</a> | <a href="/fb/receive">Recibir mensajes</a></p>
  </footer>
</body>
</html>
