<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KeyChat — Enviar mensaje cifrado">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <title>Enviar Mensaje — KeyChat</title>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Principal">
      <a href="/" class="nav-logo">KeyChat</a>
      <ul class="nav-links">
        <li><a href="/fb/send">Enviar</a></li>
        <li><a href="/fb/receive">Recibir</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <h1>Enviar Mensaje Cifrado</h1>
    <p>Pega el blob cifrado desde la aplicación KeyChat en tu dispositivo.</p>
    <form method="POST" action="/fb/submit-event">
      <label for="pubkey">Clave pública del destinatario (64 caracteres hex):</label>
      <input type="text" id="pubkey" name="pubkey" pattern="[0-9a-fA-F]{64}" maxlength="64" required placeholder="Destinatario (64 hex)">
      <label for="content">Blob cifrado (hex):</label>
      <textarea id="content" name="content" rows="8" required placeholder="Pega aquí el blob cifrado..."></textarea>
      <label for="kind">Tipo de evento:</label>
      <select id="kind" name="kind">
        <option value="1059">Mensaje cifrado (1059)</option>
        <option value="1">Nota (1)</option>
      </select>
      <button type="submit" class="btn">Enviar mensaje</button>
    </form>
    <p><a href="/fb/receive">Recibir mensajes</a></p>
  </main>
  <footer class="site-footer">
    <p>KeyChat — Proyecto educativo de criptografía asimétrica y mensajería Nostr</p>
    <p><a href="/">Inicio</a> | <a href="/fb/send">Enviar mensaje</a> | <a href="/fb/receive">Recibir mensajes</a></p>
  </footer>
</body>
</html>
