name: Bug Report
description: Report a bug to help us improve KeyChat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report!

        Before you continue:
        - Check [existing issues](https://github.com/meyer-pidiache/keychat/issues) to avoid duplicates
        - If the relay is unreachable, verify it's running on port 8080

  - type: checkboxes
    id: pre-check
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and found no duplicate
          required: true
        - label: I can reproduce the issue consistently
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of KeyChat is affected?
      options:
        - Nostr relay (WebSocket)
        - FreeBasics bridge (HTTP forms)
        - Educational pages
        - PWA client (JS crypto)
        - Deployment / Docker
        - Other
    validations:
      required: true

  - type: dropdown
    id: access
    attributes:
      label: Access method
      description: How are you accessing KeyChat?
      options:
        - Direct browser (PWA)
        - FreeBasics (no JS)
        - Nostr client (Damus, Amethyst, noscl)
        - REST API
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
      placeholder: "The relay rejects valid NIP-01 events with..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Connect to ws://relay:8080 with noscl
        2. Send a kind-1 event with valid signature
        3. See error: "invalid: event signature verification failed"
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "The event should be accepted and stored"
    validations:
      required: true
